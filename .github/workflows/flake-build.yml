name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            extra_nix_config: ""
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            extra_nix_config: ""
          - system: aarch64-darwin
            runner: macos-14
            extra_nix_config: |
              sandbox = relaxed
              extra-sandbox-paths = /System/Library/Frameworks /System/Library/PrivateFrameworks /usr/lib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            ${{ matrix.extra_nix_config }}

      - uses: cachix/cachix-action@v14
        if: github.event_name == 'pull_request'
        with:
          name: jeffrey-dot-li
          skipPush: true

      - uses: cachix/cachix-action@v14
        if: github.event_name != 'pull_request'
        with:
          name: jeffrey-dot-li
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check formatting
        run: nix build ".#checks.${{ matrix.system }}.treefmt" --print-build-logs

      - name: Build default package
        run: nix build .#default --print-build-logs

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v14
        with:
          name: jeffrey-dot-li
          skipPush: true

      - name: Check formatting
        run: nix build .#checks.x86_64-linux.treefmt --print-build-logs

      # Evaluation is platform-independent and `--dry-run` never builds, so a
      # single x86_64-linux runner can validate every host, including the
      # aarch64-darwin ones. This forces the full module graph to evaluate via
      # each system's toplevel derivation and surfaces eval errors, renamed
      # options, and unresolvable build plans without paying for real builds.
      - name: Dry-run every system configuration
        run: |
          set -u
          fail=0
          for attr in \
            nixosConfigurations.latte.config.system.build.toplevel \
            darwinConfigurations.applin.system \
            darwinConfigurations.co-applin.system
          do
            echo "::group::dry-run $attr"
            nix build --dry-run --no-link ".#$attr" || fail=1
            echo "::endgroup::"
          done
          exit "$fail"